<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&family=Noto+Sans+JP:wght@200;400&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px}
  body{background:#000;color:#fff;font-family:Inter,'Noto Sans JP',sans-serif;
       font-feature-settings:'palt' 1;position:relative;overflow:hidden}
  canvas{position:absolute;inset:0;width:1200px;height:630px}
  .wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-size:16px;font-weight:600;letter-spacing:.16em;color:#ffb829}
  h1{font-size:82px;font-weight:400;letter-spacing:-.035em;line-height:1.08;max-width:16em}
  .foot{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:600;letter-spacing:.16em}
  svg{width:26px;height:26px}
  .sub{font-size:19px;font-weight:200;color:#bdbdbd;letter-spacing:.02em;margin-top:22px}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="wrap">
  <div class="eyebrow">同志社大学公認 / IT起業サークル</div>
  <div>
    <h1>作って、<br>売る。</h1>
    <div class="sub">同志社IT起業サークル / 学年・学部・経験不問。入会費無料。</div>
  </div>
  <div class="foot">
    <svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8052ff"/><stop offset="1" stop-color="#15846e"/></linearGradient></defs>
    <path d="M12.2 1.5 L21.5 22 L12.2 22 Z" fill="url(#g)"/>
    <path d="M9.4 8.6 L2.5 22 L9.4 22 Z" fill="none" stroke="#8052ff" stroke-width="1.3"/></svg>
    <span>DOSHISHA IT CLUB</span>
  </div>
</div>
<script>
  // サイトのヒーローと同じく、粒で「1」を描く（静止1フレーム）。
  const PAL=['#8052ff','#a78bfa','#5b8dff','#e05cff','#ffb829','#4fd1c5','#15846e'],W8=[34,20,16,9,8,8,5];
  function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6d2b79f5)>>>0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  const rand=rng(20260401),tot=W8.reduce((a,b)=>a+b,0);
  const pick=()=>{let t=rand()*tot;for(let i=0;i<W8.length;i++){t-=W8[i];if(t<=0)return i;}return 0;};
  document.fonts.load('300 560px Inter').then(()=>{
    const cv=document.getElementById('c'),ctx=cv.getContext('2d');
    const W=1200,H=630,D=2;cv.width=W*D;cv.height=H*D;ctx.scale(D,D);
    const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');
    o.fillStyle='#fff';o.font='300 600px Inter';o.textAlign='center';o.textBaseline='middle';o.fillText('1',930,340);
    const d=o.getImageData(0,0,W,H).data,pool=[];
    for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2)if(d[(y*W+x)*4+3]>140)pool.push([x,y]);
    const tri=(x,y,s,r)=>{const c=Math.cos(r)*s,n=Math.sin(r)*s;ctx.moveTo(x+c,y+n);ctx.lineTo(x-.5*c-.866*n,y-.5*n+.866*c);ctx.lineTo(x-.5*c+.866*n,y-.5*n-.866*c);};
    for(let i=0;i<2600;i++){
      let x,y,a;
      if(i<1700){const p=pool[Math.floor(rand()*pool.length)];x=p[0]+(rand()-.5)*2;y=p[1]+(rand()-.5)*2;a=[.35,.65,1][Math.floor(rand()*3)];}
      else{const t=rand()*Math.PI*2,r=120+rand()**.8*260;x=930+Math.cos(t)*r*.8;y=330+Math.sin(t)*r;a=.16;}
      ctx.globalAlpha=a;ctx.fillStyle=PAL[pick()];ctx.beginPath();tri(x,y,1.2+rand()**2.2*3,rand()*6.28);ctx.fill();
    }
  });
</script>
</body></html>
